name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # unit tests, userscript headers, leak scan; the live-YouTube e2e needs a browser session and runs locally
      - run: bash scripts/release-check.sh
